[tools]
node = "24"
php = "8.5.9"
pnpm = "11.20.0"

[tasks.setup]
description = "Install dependencies and create the playground"
run = "bash scripts/setup.sh"

[tasks.dev]
description = "Start the KirbyUp development server"
run = "pnpm dev"

[tasks.build]
description = "Build the Panel plugin"
run = "pnpm build"
